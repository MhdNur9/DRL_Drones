seed: 42

models:
  separate: true
  policy:
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: STATES
        layers: [256, 256]
        activations: elu
    output: ACTIONS

  value:
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: STATES
        layers: [256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: TRPO

  # Aligné PPO
  rollouts: 16
  learning_epochs: 8
  mini_batches: 2

  discount_factor: 0.99
  lambda: 0.95

  # Aligné PPO (même ordre de grandeur)
  value_learning_rate: 0.0001
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}

  # Aligné PPO (mêmes preprocessors)
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0

  # Aligné PPO
  grad_norm_clip: 0.5
  value_loss_scale: 1.0
  time_limit_bootstrap: true

  # TRPO-specific (trust region exact)
  damping: 0.1
  max_kl_divergence: 0.01
  conjugate_gradient_steps: 10
  max_backtrack_steps: 10
  accept_ratio: 0.5
  step_fraction: 1.0

  rewards_shaper: null

  experiment:
    directory: "firefly_hover_TRPO_v1"
    experiment_name: 'similar_to_PPO'
    write_interval: auto
    checkpoint_interval: auto
    store_separately: false
    wandb: false
    wandb_kwargs: {}

trainer:
  class: SequentialTrainer
  # timesteps: 100000
  timesteps: 5
  environment_info: log
  close_environment_at_exit: false
