seed: 1

# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -6.0
    max_log_std: -2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: STATES
        layers: [512, 256, 128]
        activations: [elu,elu,elu]

        # activations: torch.nn.tanh
    output: ACTIONS

  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [512, 256, 128]
        activations: elu
    output: ONE

  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [512, 256, 128]
        activations: elu
    output: ONE

  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [512, 256, 128]
        activations: elu
    output: ONE

  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [512, 256, 128]
        activations: elu
    output: ONE

memory:
    class: RandomMemory
    memory_size: 4048
# SAC agent configuration (field names are from SAC_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents.html
agent:
  class: SAC
  gradient_steps: 1            # gradient steps
  batch_size: 64               # training batch size
  discount_factor: 0.99        # discount factor (gamma)
  polyak: 0.005                # soft update hyperparameter (tau)
  actor_learning_rate: 1.0e-4    # actor learning rate
  critic_learning_rate: 1.0e-4   # critic learning rate
  learning_rate_scheduler: null # learning rate scheduler class (see torch.optim.lr_scheduler)
  learning_rate_scheduler_kwargs: {} # learning rate scheduler's kwargs (e.g. {"step_size": 1e-3})
  state_preprocessor: null             # state preprocessor class (see skrl.resources.preprocessors)
  state_preprocessor_kwargs: {}        # state preprocessor's kwargs (e.g. {"size": env.observation_space})
  random_timesteps: 0          # random exploration steps
  learning_starts: 100           # learning starts after this many steps
  grad_norm_clip: 1.0            # clipping coefficient for the norm of the gradients
  learn_entropy: True          # learn entropy
  entropy_learning_rate: 1.0e-4  # entropy learning rate
  initial_entropy_value: 0.2   # initial entropy value
  target_entropy: null         # target entropy
  rewards_shaper: null         # rewards shaping function: Callable(reward, timestep, timesteps) -> reward
  mixed_precision: False       # enable automatic mixed precision for higher performance
  # logging and checkpoint
  experiment:
    directory: "sac_experiment"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto
# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 30000
  environment_info: log